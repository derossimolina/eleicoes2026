# A página lê o JSON do TSE no navegador. O CDN devolve o Origin de quem pede.
# O app.py serve o site e o caminho /tse/ fica de reserva se essa leitura falhar.
# O Render define PORT. O app.py escuta nele.
services:
  - type: web
    name: eleicoes2026
    runtime: python
    buildCommand: python -c "import sys; print(sys.version)"
    startCommand: python app.py
    pullRequestPreviewsEnabled: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
